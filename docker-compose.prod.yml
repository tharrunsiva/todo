services:
  mongodb:
    image: mongo:7.0
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS:-supersecretpassword}
      - MONGO_INITDB_DATABASE=mern_todo_db
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - mern-prod-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-supersecretpassword}@mongodb:27017/mern_todo_db?authSource=admin
      - JWT_SECRET=${JWT_SECRET:-mern_obsidian_super_secret_jwt_key_2026_docker_production}
      - JWT_EXPIRE=30d
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mern-prod-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mern-prod-network

networks:
  mern-prod-network:
    driver: bridge

volumes:
  mongo_prod_data:
    driver: local
