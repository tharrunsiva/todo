services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: obsidian-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=mern_todo_db
    volumes:
      - mongo_data:/data/db
    networks:
      - mern-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Node.js Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: obsidian-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/mern_todo_db
      - JWT_SECRET=mern_obsidian_super_secret_jwt_key_2026_docker
      - JWT_EXPIRE=30d
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mern-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # React Frontend (Nginx Production)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: obsidian-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mern-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  mern-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
